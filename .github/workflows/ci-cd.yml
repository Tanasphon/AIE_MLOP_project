name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run unit tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t mobilevit-api:test .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO_ID: ${{ secrets.HF_SPACE_REPO_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO_ID != ''
        run: pip install huggingface_hub

      - name: Deploy to Hugging Face Spaces
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO_ID != ''
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_REPO_ID"]
          api = HfApi(token=token)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".pytest_cache/*",
                  "__pycache__/*",
                  "jmeter/results/*",
                  "jmeter/report/*",
              ],
          )
          PY

      - name: Skip deploy when secrets are missing
        if: env.HF_TOKEN == '' || env.HF_SPACE_REPO_ID == ''
        run: |
          echo "HF_TOKEN or HF_SPACE_REPO_ID is not configured. Test and Docker build passed; deployment was skipped."
